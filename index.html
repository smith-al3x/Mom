<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For Mom</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
    body {
      font-family: system-ui, -apple-system;
      /* Pastel Pink Background */
      background-color: #ffe4e1; 
      /* Flower Overlay: This creates a subtle pattern of cherry blossoms */
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Ctext y='35' font-size='25' alpha='0.3'%3E🌸%3C/text%3E%3C/svg%3E");
      color: #5d2a42; /* Deep berry color for better readability on pink */
      margin: 0;
      padding: 40px 20px;
      text-align: center;
    }
  
    h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
      color: white; /* Darker hot pink for the title */
    }
  
    p {
      font-size: 1.1rem;
      max-width: 420px;
      margin: 0 auto;
      opacity: 0.9;
    }
  
    .card {
      background: rgba(255, 255, 255, 0.8); /* Semi-transparent white */
      backdrop-filter: blur(5px); /* Softens the flowers behind the card */
      padding: 24px;
      margin: 40px auto;
      max-width: 420px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(216, 27, 96, 0.15);
      border: 1px solid #f8bbd0;
    }
  
    a {
      display: block;
      /* Hot Pink Buttons */
      background: #ff1493; 
      color: white;
      text-decoration: none;
      padding: 16px;
      margin: 14px 0;
      border-radius: 50px; /* Rounded pill shape for a softer look */
      font-size: 1.1rem;
      font-weight: bold;
      transition: transform 0.2s, background 0.2s;
    }
  
    a:hover {
      background: #ff69b4; /* Lighter hot pink on hover */
      transform: translateY(-2px);
    }
  
    footer {
      margin-top: 40px;
      font-size: 0.9rem;
      opacity: 0.7;
      color: #ad1457;
    }
  </style>
</head>

<body>
  <h1> Happy Mother's day! </h1>
  <p>
    I wish I could be there in person, I love you mom!
  </p>

  <div class="card">
    <a href="https://youtu.be/S9jzMpEfg-I">🎥 Video Message (NEW!) </a>
  </div>
  
  <div class="card">
    <a href="https://share.icloud.com/photos/0c2z5xrb8uBMIZIpnxRztg20Q">📸Photos of Us Over The Years!</a>
  </div>

</body>
</html>
